[workspace]
resolver = "3"
members = [
    "crates/slab-core",
    "crates/slab-formula",
    "crates/slab-storage",
    "crates/slab-import",
    "crates/slab-print",
    "crates/slab-sync",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["SlabBase contributors"]
repository = "https://github.com/chiranjeevi-max/slabbase"
homepage = "https://github.com/chiranjeevi-max/slabbase"

[workspace.dependencies]
slab-core = { path = "crates/slab-core", version = "1.0.0" }
slab-formula = { path = "crates/slab-formula", version = "1.0.0" }
slab-storage = { path = "crates/slab-storage", version = "1.0.0" }
slab-import = { path = "crates/slab-import", version = "1.0.0" }
slab-print = { path = "crates/slab-print", version = "1.0.0" }
slab-sync = { path = "crates/slab-sync", version = "1.0.0" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rusqlite = { version = "0.43.0", features = ["bundled", "functions", "backup"] }
blake3 = "1.8.2"
libc = "0.2.180"
csv = "1.4.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
proptest = "1.12.0"
tempfile = "3.25.0"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.bench]
inherits = "release"

[workspace.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
