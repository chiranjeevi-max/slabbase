name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust gate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2
        with:
          tool: cargo-deny
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run release storage tests
        run: cargo test --release -p slab-storage --test pagination --test systems -- --test-threads=1
      - name: Audit dependencies
        run: cargo deny check

  desktop:
    name: Desktop gate (${{ matrix.shard }}/4)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Typecheck frontend
        run: npm --prefix apps/desktop run typecheck
      - name: Build production frontend
        run: npm --prefix apps/desktop run build
      - name: Check production bundle for fixture leakage
        run: |
          set -euo pipefail
          for needle in "Northlight Studio" "INV-2026" "fixtureCall" "DESIGN_STUDIO"; do
            if grep -R -F "$needle" apps/desktop/dist/; then
              echo "::error::Fixture string '$needle' leaked into the production bundle"
              exit 1
            fi
          done
      - name: Install Playwright Chromium
        run: npm --prefix apps/desktop exec -- playwright install chromium
      - name: Run UI audit
        run: npm --prefix apps/desktop run test:ui -- --shard=${{ matrix.shard }}/4 --output=test-results
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: Bundle check
    runs-on: macos-26
    needs: [rust, desktop]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install cargo-auditable
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2
        with:
          tool: cargo-auditable
      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci
      - name: Build production frontend
        run: npm --prefix apps/desktop run build
      - name: Build auditable release binary
        run: cargo auditable build --release -p slabbase-desktop --features tauri/custom-protocol --bins
      - name: Verify auditable dependency section
        run: otool -l target/release/slabbase-desktop | grep -q dep-v0
      - name: Build macOS application bundle
        run: npm --prefix apps/desktop run tauri build
